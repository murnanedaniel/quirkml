# Quirk sample, stage 2: Geant4 on ODD v6 (tracker only) with the QuirkDDG4 plugin (user_physics).
dataset: "{DATASET}"
stage: "simulation"
events: {EVENTS_PER_RUN}
threads: {SIM_THREADS}                # Geant4 threads, one event per thread
# seed: given per run on the command line, <dataset>_<version>_run<N> (colliderml/run_stage.sh)
input_filename: merged_events.hepmc3
minimalKineticEnergy: 0.1
truthParticleHandler: "Geant4FullTruthParticleHandler"
vertexOffset: [0.0, 0.0, 0.0, 0.0]
vertexSigma:  [0.0, 0.0, 0.0, 0.0]    # smearing was applied in stage 1
odd_compact_files:
  - /opt/odd-install/share/OpenDataDetector/xml/OpenDataDetectorDefs.xml
  - /opt/odd-install/share/OpenDataDetector/xml/OpenDataDetectorTracker.xml
  - /workspace/configs_production/drift_beamspot/geometry/tracker_fields_plugins.xml
ddsim_printLevel: 6
filter_g4_warnings: true
user_physics:
  - type: QuirkPhysics/Quirks
    library: /work/plugin/libQuirkDDG4.so
    properties:                       # values from quirk-gen's events.json
      Mass: {MASS_MEV}                  # MeV  (mass_gev x 1000)
      Charge: {CHARGE}                     # quirk-gen: +10000100 has charge +1
      PdgId: {PDGID}
      StringForce: {STRINGFORCE}   # MeV/mm, Lambda^2 / hbar c for Lambda = {LAMBDA_EV} eV
      FirstStringLen: 1.0e-6          # mm
      MaxBoost: {MAX_BOOST}                # 1e-2 is not converged for slack strings (docs/validation_status.md)
      MaxMergeT: 1.0e-6
      MaxMergeMag: 1.0e-6
      EnableEM: true                  # full EM on the quirks (ionisation, msc, brems, pair)
      EnablePairProduction: false     # Geant4 11.3 has no pair-production tables for the quirks and stops
                                      # the run (em0033); the effect is ~3e-5 of ionisation (docs/colliderml.md)
