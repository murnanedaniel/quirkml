# One quirk sample: copy this file, edit it, then
#   python colliderml/make_sample.py my_sample.yaml
#
# Paths. Everything the container reads or writes must be under /global/cfs/cdirs/m4958 or
# under your $PSCRATCH: those are the only host paths podman-hpc mounts. $USER and $PSCRATCH
# are expanded.
work_dir: /global/cfs/cdirs/m4958/usr/$USER/quirks   # setup.sh put colliderml-production and the python env here
cache_dir: /global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache   # shared Geant4 data (m4958 group)
quirkgen_scratch: $PSCRATCH/quirkgen                  # MadGraph cannot run on CFS; outputs are copied back

# Naming: runs go to <work_dir>/runs/<campaign>/<dataset>/<version>/runs/0, where dataset is
# m<mass>_L<lambda>_mu<mu>.
campaign: quirk
version: v0

# Physics point.
mass_gev: 400        # quirk mass; quirk-gen generates this
lambda_ev: 1000      # string scale Lambda (sqrt of the tension); used only in the simulation
mu: 0                # pileup: 0 for none, else mean number of Pythia8 SoftQCD events
events: 20           # events through the whole chain (quirk-gen generates this many)
seed: 1              # quirk-gen seed; the ColliderML stages use seed + 41, + 42, + 43

# Simulation. MaxBoost caps the QuirkDDG4 step; 1e-2 is off by 1.3 mm at Lambda = 0.5 keV,
# 1e-3 agrees with 1e-4 to 0.1 mm (docs/validation_status.md).
max_boost: 1.0e-3
