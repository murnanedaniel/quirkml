[project]
name = "lap1015"
version = "0.2.0"
description = "Optional compiled LAP solver vendored with ml_tracking"
requires-python = "==3.12"
dependencies = ["numpy>=2.1.2,<3"]

[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/lap1015"]
