name: ColliderML_LRT_Higgs_Portal

data:
  # Must equal model.model.decoder.num_queries.
  dataset_root: /global/cfs/cdirs/m4958/data/ColliderML/simulation/hard_scatter/higgs_portal/v1/parquet
  event_max_num_particles: 256

  # Legacy ttbar paths below are ignored when dataset_root is set.
  # Paths to preprocessed data directories
  train_dir: /share/lustre/maxhart/data/colliderml/v1/pu200/
  val_dir: /share/lustre/maxhart/data/colliderml/v1/pu200/
  test_dir: /share/lustre/maxhart/data/colliderml/v1/pu200/

  # Event process name in this directory layout
  event_type: ttbar

  # Number of events to include in each set
  num_workers: 0
  batch_size: 1
  num_train: -1
  num_test: 20000  # must cover test_chunks completely for lrt_report full-chunk coverage
  num_val: 100
  train_chunks: [0, 793]
  val_chunks: [794, 795]
  test_chunks: [796, 815]

  # Minimum pT for a particle to be deemed reconstructve in GeV
  particle_min_pt: 0.5
  particle_max_abs_eta: 4.0

  # Optional per-particle-type hit-content cuts.
  # When non-empty, these override the legacy global hit cuts.
  # Supported particle keys: all, charged_hadron, neutral_hadron,
  # electron, photon, muon, tau, neutrino, other
  # Supported cut keys: min_num_sihit, min_num_ecal, min_num_hcal
  particle_hit_cuts:
    all:
      min_num_sihit: 3

  # Whether to include charged / neutral particles as targets
  particle_include_charged: true
  particle_include_neutral: false
  particle_require_primary: true

  return_calohits: false
  return_tracks: false

# Training stuff here
trainer:
  max_epochs: 10
  accelerator: cpu
  devices: 1
  precision: 32-true
  log_every_n_steps: 10
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: true
  val_check_interval: 1000

  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: lrt_higgs_portal

  callbacks:
    - class_path: ml_tracking.experiments.colliderml.prediction_writer.CanonicalPredictionWriter
      init_args:
        out_dir: outputs/colliderml_lrt_predictions
        object_threshold: 0.5
        mask_threshold: 0.5
    # - class_path: ml_tracking.callbacks.Compile
    - class_path: ml_tracking.callbacks.InferenceTimer
    - class_path: ml_tracking.callbacks.SaveConfig
    - class_path: ml_tracking.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        every_n_train_steps: 2000
    # Periodic step-stamped checkpoints (independent of val/loss) so
    # step-matched A/B comparisons between experiments are possible.
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "periodic-step{step}"
        auto_insert_metric_name: false
        every_n_train_steps: 20000
        save_top_k: -1
    - class_path: ml_tracking.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  optimizer: lion

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-5
    pct_start: 0.001
    skip_scheduler: false
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: ml_tracking.models.MaskFormer
    init_args:
      dim: &dim 256
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.InputNet
              init_args:
                input_name: sihit
                input_dtype: float32
                fields:
                  - x
                  - y
                  - z
                  - r
                  - s
                  - eta
                  - phi
                  - layer_id
                net:
                  class_path: ml_tracking.models.Dense
                  init_args:
                    input_size: 8
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: ml_tracking.models.posenc.PositionEncoder
                  init_args:
                    input_name: sihit
                    dim: *dim
                    fields:
                      - r
                      - eta
                      - phi

      encoder:
        class_path: ml_tracking.models.Encoder
        init_args:
          num_layers: 4
          dim: *dim
          attn_type: torch
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        num_decoder_layers: 4
        num_queries: 256
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false, attn_type: torch}

      matcher:
        class_path: ml_tracking.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 0.1
                costs:
                  object_bce: 0.1
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false

            - class_path: ml_tracking.models.task.ObjectHitMaskTask
              init_args:
                name: flow_sihit_assignment
                input_constituent: sihit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 2.0
                  mask_focal: 100.0
                costs:
                  mask_dice: 2.0
                  mask_focal: 100.0
                null_weight: 1.0
                dim: *dim
