# Rebalance object-existence loss to upstream TrackML weight (0.1 -> 1.0).
# Autopsy (lrt_runs/autopsy): ~90% of missed fiducial particles are "invisible"
# (no query proposes them); existence loss at 0.1 vs mask loss at ~100 barely
# trains detection. Upstream trackml/tracking-lite.yaml uses object_bce 1.0.
model:
  model:
    init_args:
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 1.0
                costs:
                  object_bce: 1.0
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false

            - class_path: ml_tracking.models.task.ObjectHitMaskTask
              init_args:
                name: flow_sihit_assignment
                input_constituent: sihit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 2.0
                  mask_focal: 100.0
                costs:
                  mask_dice: 2.0
                  mask_focal: 100.0
                null_weight: 1.0
                dim: 256
