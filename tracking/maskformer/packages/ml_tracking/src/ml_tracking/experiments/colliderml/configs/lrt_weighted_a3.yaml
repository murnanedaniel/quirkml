# Overlay for lrt_higgs_portal.yaml. Pass the base config first, then this file.
# jsonargparse replaces lists, so repeat the complete task list.
model:
  model:
    init_args:
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 0.1
                costs:
                  object_bce: 0.1
                dim: 256
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false

            - class_path: ml_tracking.models.task.ObjectHitMaskTask
              init_args:
                name: flow_sihit_assignment
                input_constituent: sihit
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  mask_dice: 2.0
                  mask_focal: 100.0
                costs:
                  mask_dice: 2.0
                  mask_focal: 100.0
                null_weight: 1.0
                dim: 256
                object_weight_field: particle_r
                object_weight_fn: log_radius
                object_weight_alpha: 3.0
