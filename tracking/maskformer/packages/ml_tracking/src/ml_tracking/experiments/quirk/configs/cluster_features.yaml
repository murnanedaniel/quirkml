# Add cluster-shape columns as hit features (log1p of sizes / channel count /
# summed activation, plus eta_angle, phi_angle as stored).
# NOTE: eta_angle and phi_angle are identically 0 in the m400 dev set.
data:
  cluster_features: true
model:
  model:
    init_args:
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.InputNet
              init_args:
                input_name: sihit
                input_dtype: float32
                fields: [x, y, z, r, s, eta, phi, layer_id,
                         log_size_loc0, log_size_loc1, log_n_channels, log_sum_activation, eta_angle, phi_angle]
                net:
                  class_path: ml_tracking.models.Dense
                  init_args:
                    input_size: 14
                    hidden_layers: [128]
                    output_size: 256
                    activation: SwiGLU
                posenc:
                  class_path: ml_tracking.models.posenc.PositionEncoder
                  init_args:
                    input_name: sihit
                    dim: 256
                    fields: [r, eta, phi]
