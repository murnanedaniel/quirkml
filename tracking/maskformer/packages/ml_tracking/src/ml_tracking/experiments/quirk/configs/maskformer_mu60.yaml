# mu 60 MaskFormer (overlay on quirk.yaml): graph-free FlexGeo setup of the review thread on the hits kept by the
# FlexGeo hit filter (filter_mu60_flex.yaml, masks in quirk_tracking_data/hit_masks_mu60/<tag>/<set>).
# Targets: the quirk pair as one object + charged primary particles with pT > 1 GeV, |eta| < 4, >= 3 hits; 256 queries.
# Recipe (REVIEW_SYNC_2026-11-03): Lion 5e-5 at 1 event/update, warmup 1.5k steps then constant; budgets are read
# with linear decay branches to ~0 over the last 20% off the constant trunk (no early stopping); clip 0.1, wd 1e-5,
# bf16; spike guard 20x median (window 500, min history 100, backstop 500); loss 0.1 object BCE / 2 Dice / 50 focal /
# 5 null-mask focal; matching focal cost normalised by hit count; 8 decoder layers.
# Trunk: max_steps T with warmup_frac 1500/T and cooldown_frac 0. Branch from the trunk checkpoint at step s with
# decay D: --ckpt_path <trunk step s> --trainer.max_steps s+D --model.lrs_config.warmup_frac 1500/(s+D)
# --model.lrs_config.cooldown_frac D/(s+D) (the LambdaLR lambda is rebuilt from the config on resume).
name: quirk_mf_mu60

data:
  dataset_root: /global/cfs/cdirs/m4958/usr/danieltm/ColliderML/quirk_tracking_data/parquet_r1_mu60/m200_L774_mu60
  hit_mask_dir: null  # every mu 60 run so far used null; set to a hit-mask directory to train on filtered hits
  train_events: [3000, 99999]
  val_events: [2000, 2999]
  test_events: [0, 1999]
  num_train: -1
  num_val: 100
  num_test: -1
  batch_size: 1
  num_workers: 2
  row_group_cache_size: 3  # hits, particles and hit-mask files of one 1000-event block (1 thrashes: re-read per event)
  block_shuffle: true
  event_max_num_particles: 256
  particle_min_pt: 1.0
  particle_max_abs_eta: 4.0
  min_num_sihit: 3
  particle_require_primary: true
  include_quirks: true
  quirk_pdg_ids: [10000100]
  quirk_min_num_sihit: 1
  quirk_pair_target: true
  cluster_features: true

trainer:
  max_steps: 100000
  default_root_dir: /pscratch/sd/d/danieltm/quirk_mu60/runs/mf_trunk
  gradient_clip_val: 0.1
  val_check_interval: 2000
  callbacks:
    - class_path: ml_tracking.experiments.quirk.prediction_writer.QuirkPredictionWriter
      init_args: {out_dir: predictions, object_threshold: 0.1, mask_threshold: 0.5}
    - class_path: ml_tracking.experiments.quirk.monitor.TrainingMonitor
      init_args: {log_every_n_steps: 10}
    - class_path: ml_tracking.callbacks.SaveConfig
    - class_path: ml_tracking.callbacks.Checkpoint
      init_args: {monitor: val/loss}
    # branch points: a checkpoint every 4k steps, all kept
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args: {every_n_train_steps: 4000, save_top_k: -1, filename: "trunk-step={step:06d}", auto_insert_metric_name: false}
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args: {logging_interval: step}
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args: {refresh_rate: 50}

model:
  optimizer: Lion
  spike_guard: {factor: 20.0, window: 500, min_history: 100, max_consecutive: 500}
  lrs_config:
    schedule: wsd
    warmup_frac: 0.015
    cooldown_frac: 0.0
    initial: 1e-6
    max: 5e-5
    end: 1e-9
    skip_scheduler: false
    weight_decay: 1e-5
  mtl: false

  model:
    class_path: ml_tracking.experiments.quirk.flexgeo.FlexMaskFormer
    init_args:
      flex: {dphi: 0.15, deta: 0.3, bands: 32, rotary: true}
      dim: &dim 256
      input_sort_field: null

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.InputNet
              init_args:
                input_name: sihit
                input_dtype: float32
                fields: [x, y, z, r, s, eta, phi, layer_id, log_size_loc0, log_size_loc1, log_n_channels, log_sum_activation]
                net:
                  class_path: ml_tracking.models.Dense
                  init_args: {input_size: 12, hidden_layers: [128], output_size: *dim, activation: SwiGLU}
                posenc:
                  class_path: ml_tracking.models.posenc.PositionEncoder
                  init_args: {input_name: sihit, dim: *dim, fields: [r, eta, phi]}

      encoder:
        class_path: ml_tracking.models.Encoder
        init_args:
          num_layers: 10
          dim: *dim
          attn_type: torch
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        num_decoder_layers: 8
        num_queries: 256
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false, attn_type: torch}

      matcher:
        class_path: ml_tracking.models.matcher.Matcher
        init_args: {default_solver: scipy, adaptive_solver: false, parallel_solver: true}

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses: {object_bce: 0.1}
                costs: {object_bce: 0.1}
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: true
                has_first_layer_loss: false
            - class_path: ml_tracking.models.task.ObjectHitMaskTask
              init_args:
                name: flow_sihit_assignment
                input_constituent: sihit
                input_object: query
                output_object: flow
                target_object: particle
                losses: {mask_dice: 2.0, mask_focal: 50.0}
                costs: {mask_dice: 2.0, mask_focal: 50.0}
                null_mask_weight: 5.0
                normalize_focal_cost: true
                null_weight: 1.0
                dim: *dim
