# Memorisation gate: train and validate on the same 8 events; AdamW, warmup 5% then cosine to ~0
# (OneCycleLR: initial 1e-5 -> max 3e-4 -> end 1e-9).
data:
  train_events: [0, 7]
  val_events: [0, 7]
  allow_split_overlap: true
  num_workers: 1
trainer:
  max_steps: 8000
  val_check_interval: 1000
model:
  optimizer: AdamW
  lrs_config:
    schedule: onecycle
    initial: 1e-5
    max: 3e-4
    end: 1e-9
    pct_start: 0.05
    weight_decay: 0.0
    skip_scheduler: false
