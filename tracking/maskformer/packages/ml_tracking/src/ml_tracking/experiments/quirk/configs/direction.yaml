# Stage D arm: no-origin inputs (noorigin.yaml) + offline cluster-direction features (quirkml/tracking/direction):
# sign- and mirror-invariant axis encoding M (6), diag_sign * D (6), diag_sign, phi/eta_angle_abs, validity flag.
# Control: noorigin.yaml alone (same seed, LR, steps, batch). Pass after noorigin.yaml.
data:
  cluster_features: true
  direction_dir: /global/cfs/cdirs/m4958/usr/danieltm/ColliderML/quirk_tracking_data/direction/m200_L774_mu0
  row_group_cache_size: 96
model:
  model:
    init_args:
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: ml_tracking.models.InputNet
              init_args:
                input_name: sihit
                fields: [x, y, z, r, layer_id, log_size_loc0, log_size_loc1, log_n_channels, log_sum_activation,
                         dir_m0, dir_m1, dir_m2, dir_m3, dir_m4, dir_m5, dir_d0, dir_d1, dir_d2, dir_d3, dir_d4, dir_d5,
                         dir_sign, dir_phi, dir_eta, dir_valid]
                net:
                  class_path: ml_tracking.models.Dense
                  init_args:
                    input_size: 25
                    hidden_layers: [128]
                    output_size: 256
                    activation: SwiGLU
